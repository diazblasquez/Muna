<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/checkout/checkout.css">
    <link rel="icon" href="../../image/favicon.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">

    <title>Muna | Verificación de compra</title>
    <script src="../../js/paths.js"></script>
    <script src="../../js/api.js"></script>
</head>
<body class="checkout-page">

    <div class="checkout-top">
        <a href="../index.html" class="checkout-top-logo">MÜNA</a>
    </div>

    <ol class="checkout-stepper">
        <li class="done"><span class="step-dot"></span><span class="step-label">Carrito</span></li>
        <li class="step-line"></li>
        <li class="active"><span class="step-dot"></span><span class="step-label">Verificación</span></li>
        <li class="step-line"></li>
        <li><span class="step-dot"></span><span class="step-label">Orden Confirmada</span></li>
    </ol>

    <div class="checkout-layout">

        <!-- ===================== COLUMNA IZQUIERDA: FORMULARIO ===================== -->
        <form id="checkout-form" class="checkout-form-col" novalidate>

            <div class="checkout-card">
                <h2>Información de envío</h2>
                <p class="form-error" id="datos-error" hidden></p>

                <div class="field">
                    <label for="mail">Correo electrónico <span class="required">*</span></label>
                    <input type="email" id="mail" name="mail" required>
                </div>

                <div class="field-grid-2">
                    <div class="field">
                        <label for="nombre">Nombre <span class="required">*</span></label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
                    <div class="field">
                        <label for="apellido">Apellidos <span class="required">*</span></label>
                        <input type="text" id="apellido" name="apellido" required>
                    </div>
                </div>

                <div class="field">
                    <label for="direccion">Dirección de la calle <span class="required">*</span></label>
                    <input type="text" id="direccion" name="direccion" required>
                </div>

                <div class="field">
                    <label for="piso">Apartamento, habitación, escalera, etc. <span class="opcional">(opcional)</span></label>
                    <input type="text" id="piso" name="piso">
                </div>

                <div class="field-grid-2">
                    <div class="field">
                        <label for="codigoPostal">Código postal <span class="required">*</span></label>
                        <input type="text" id="codigoPostal" name="codigoPostal" required>
                    </div>
                    <div class="field">
                        <label for="localidad">Localidad <span class="required">*</span></label>
                        <input type="text" id="localidad" name="localidad" required>
                    </div>
                </div>

                <div class="field">
                    <label for="telefono">Teléfono <span class="opcional">(opcional)</span></label>
                    <div class="field-phone">
                        <span class="phone-prefix">🇦🇷 +54</span>
                        <input type="tel" id="telefono" name="telefono">
                    </div>
                </div>
            </div>

            <div class="checkout-card">
                <h2>Medio de pago</h2>
                <div class="option-list">
                    <label class="option-card">
                        <input type="radio" name="pago" value="transferencia" checked>
                        <span class="option-title">Transferencia / billetera digital</span>
                        <span></span>
                        <span class="option-desc">Te enviamos los datos por email para transferir.</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="pago" value="efectivo">
                        <span class="option-title">Efectivo</span>
                        <span></span>
                        <span class="option-desc">Paga en efectivo en el momento de la entrega.</span>
                    </label>
                </div>
            </div>

            <div class="checkout-card">
                <h2>Envío Método</h2>
                <div class="option-list">
                    <label class="option-card">
                        <input type="radio" name="envio" value="retiro" checked>
                        <span class="option-title">Recogida local</span>
                        <span class="option-price">Gratis</span>
                        <span class="option-desc">Retirás tu pedido en el local.</span>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="envio" value="domicilio">
                        <span class="option-title">Envío a domicilio</span>
                        <span class="option-price" id="precio-envio-domicilio">$3.500</span>
                        <span class="option-desc" id="envio-domicilio-desc">Costo según tu localidad.</span>
                    </label>
                </div>
            </div>
        </form>

        <!-- ===================== COLUMNA DERECHA: RESUMEN ===================== -->
        <aside class="summary-card">
            <h2>Resumen del pedido</h2>

            <div class="summary-products" id="summary-products"></div>

            <div class="summary-totals">
                <div><span>Subtotal</span><span id="summary-subtotal">$0</span></div>
                <div><span>Envío</span><span id="summary-envio">Gratis</span></div>
                <div class="summary-total-final"><span>Total</span><span id="summary-total">$0</span></div>
            </div>

            <button type="submit" form="checkout-form" class="checkout-submit" id="btn-confirmar">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                Confirmar Pago
            </button>
        </aside>
    </div>

    <script src="../../js/auth.js"></script>
    <script src="../../js/cart.js"></script>
    <script src="../../js/checkout.js"></script>
</body>
</html>
