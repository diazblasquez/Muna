<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/nav.css">
    <link rel="stylesheet" href="../../css/footer.css">
    <link rel="stylesheet" href="../../css/pages/static-pages.css">
    <link rel="icon" href="../../image/favicon.png" type="image/png">

    <!-- Carga de fuentes y librerías de íconos -->
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <!--font Onest-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">

    <title>Muna | Contacto</title>
    <script src="../../js/paths.js"></script>
    <script src="../../js/api.js"></script>
</head>
<body>
    <div id="nav-placeholder"></div>

    <main class="static-page">

        <div class="page-hero">
            <h1>Contacto</h1>
            <p>¿Tenés una consulta, un pedido especial o una sugerencia? Escribinos.</p>
        </div>

        <div class="contact-layout">

            <div class="contact-form-card">
                <h2>Envianos un mensaje</h2>

                <p class="form-feedback" id="contact-feedback" hidden></p>

                <form id="contact-form" novalidate>
                    <div class="field">
                        <label for="contact-nombre">Nombre</label>
                        <input type="text" id="contact-nombre" name="nombre" required>
                    </div>
                    <div class="field">
                        <label for="contact-email">Correo electrónico</label>
                        <input type="email" id="contact-email" name="email" required>
                    </div>
                    <div class="field">
                        <label for="contact-asunto">Asunto</label>
                        <input type="text" id="contact-asunto" name="asunto" required>
                    </div>
                    <div class="field">
                        <label for="contact-mensaje">Mensaje</label>
                        <textarea id="contact-mensaje" name="mensaje" required></textarea>
                    </div>
                    <button type="submit" class="btn-enviar">Enviar mensaje</button>
                </form>
            </div>

            <div class="contact-info-card">
                <h2>Otras formas de contactarnos</h2>

                <div class="contact-info-item">
                    <span class="contact-info-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16v16H4z" opacity="0"></path>
                            <path d="M22 6l-10 7L2 6"></path>
                            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                        </svg>
                    </span>
                    <div>
                        <h3>Email</h3>
                        <a href="mailto:hola@muna.com.ar">hola@muna.com.ar</a>
                    </div>
                </div>

                <div class="contact-info-item">
                    <span class="contact-info-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path>
                        </svg>
                    </span>
                    <div>
                        <h3>WhatsApp</h3>
                        <a href="https://wa.me/5491140931553">+54 9 11 4093-1553</a>
                    </div>
                </div>

                <div class="contact-info-item">
                    <span class="contact-info-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                    </span>
                    <div>
                        <h3>Local</h3>
                        <p>[Tu dirección acá], Buenos Aires</p>
                    </div>
                </div>

                <div class="contact-info-item">
                    <span class="contact-info-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                    </span>
                    <div>
                        <h3>Horario</h3>
                        <p>Lunes a sábado, de 9 a 19 hs</p>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <script src="../../js/includes.js"></script>
    <script src="../../js/contacto.js"></script>
</body>
</html>
