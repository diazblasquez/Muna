<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/auth/auth.css">
    <link rel="icon" href="../../image/favicon.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">

    <title>Muna | Acceder</title>
    <script src="../../js/paths.js"></script>
</head>
<body class="auth-page">

    <a href="../index.html" class="auth-top-logo">MÜNA</a>

    <main class="auth-card">
        <h1>Acceder</h1>

        <p class="auth-error" id="login-error" hidden></p>

        <form id="login-form" novalidate>
            <div class="auth-field">
                <label for="login-email">Nombre de usuario o correo electrónico <span class="required">*</span></label>
                <input type="text" id="login-email" name="email" required autocomplete="username">
            </div>

            <div class="auth-field auth-field-password">
                <label for="login-password">Contraseña <span class="required">*</span></label>
                <input type="password" id="login-password" name="password" required autocomplete="current-password">
                <button type="button" class="toggle-password" data-target="login-password" aria-label="Mostrar contraseña">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>

            <label class="auth-remember">
                <input type="checkbox" name="recordar">
                Recuérdame
            </label>

            <button type="submit" class="auth-submit">Acceso</button>
        </form>

        <div class="auth-links">
            <a href="#" id="forgot-password-link">¿Olvidaste la contraseña?</a>
            <p><span class="auth-muted">¿No tenés cuenta?</span> <a href="register.html">Registrate</a></p>
        </div>
    </main>

    <script src="../../js/auth.js"></script>
    <script src="../../js/password-toggle.js"></script>
    <script src="../../js/login.js"></script>
</body>
</html>
