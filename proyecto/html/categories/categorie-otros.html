<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/nav.css">
    <link rel="stylesheet" href="../../css/categories.css">
    <link rel="stylesheet" href="../../css/products.css">
    <link rel="stylesheet" href="../../css/footer.css">
    <link rel="stylesheet" href="../../css/cart/cart.css">
    <link rel="icon" href="../../image/favicon.png" type="image/png">

    <!-- Carga de fuentes y librerías de íconos -->
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">  
    

    <!--font Onest-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">
    <title>Muna</title>
    <script src="../../js/paths.js"></script>
</head>
<body>
    <div id="nav-placeholder"></div>

    <main>
    <section>
        <div class="home-container">
            <img class="home" src="../../image/categories/otros.jpg" alt="Fondo Alfajores">
            <div class="overlay">
            <p>Otros</p>
        </div>
        </div>
        

    </section>

    <section id="productos"  class="grid-1"> 
            <a href="../product-detail/product-detail--cookies.html">
                <div class="products--container">
                <img class="img-products" src="../../image/Productos/Otros/cookies.jpg" alt="cookies">
                <p class="product--name">Cookies</p>
                <p class="product--price">$ 12.000 - $ 24.000</p>
            </div>
            </a>
    </section>
    <!-- Botón del Carrito Flotante -->
            <div class="floating-cart" id="floating-cart">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                <span class="cart-badge" id="cart-badge">0</span>
            </div>

            <!-- Columna Lateral Derecha Desplegable -->
            <div class="cart-sidebar" id="cart-sidebar">
                <div class="cart-sidebar-header">
                    <h3>Mi Carrito</h3>
                    <button class="close-cart" id="close-cart">&times;</button>
                </div>
                
                <!-- Contenedor de productos dinámicos -->
                <div class="cart-sidebar-items" id="cart-sidebar-items"></div>
                
                <div class="cart-sidebar-footer">
                    <div class="cart-total-box">
                        <span>Total:</span>
                        <span id="cart-sidebar-total">$0</span>
                    </div>
                    <button class="btn-checkout">Finalizar Compra</button>
            </div>
    </main>
    
<div id="footer-placeholder"></div>
<script src="../../js/includes.js"></script>
    <script src="../../js/cart.js"></script>
</body>
</html>
